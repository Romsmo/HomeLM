[project]
name = "cat-satellite"
version = "0.1.0"
description = "Cat-Satellit: Wake-Word, Mikrofon und Lautsprecher für einen Raum (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Nur auf dem Pi nötig (Hardware-Audio und Wake-Word). Die Tests laufen ohne.
audio = [
    "sounddevice>=0.5",
    "openwakeword>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
cat-satellite = "cat_satellite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cat_satellite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
