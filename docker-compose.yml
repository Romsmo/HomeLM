name: homelm

services:
  backend:
    # Liefert API und das gebaute Frontend aus (ein Container, kein extra Webserver).
    build: .
    image: homelm-backend:latest
    container_name: homelm-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Standard: nur lokal. Auf dem Server CAT_BIND_ADDR=192.168.0.10 setzen, nie 0.0.0.0.
      - "${CAT_BIND_ADDR:-127.0.0.1}:${CAT_HOST_PORT:-8090}:8000"
      # HTTPS (nur aktiv, wenn data/certs/server.crt und server.key da sind, docs/https.md)
      - "${CAT_BIND_ADDR:-127.0.0.1}:${CAT_TLS_HOST_PORT:-8443}:8443"
    # Auf dem Server CAT_UID/CAT_GID auf den Besitzer von ./data setzen (Bind-Mount).
    user: "${CAT_UID:-10001}:${CAT_GID:-10001}"
    environment:
      HOME: /tmp
      # openHAB läuft im Host-Netzwerk. Das Gateway des festen Cat-Subnetzes ist der Host.
      # Auf dem Server muss ufw diesen Weg erlauben (docs/devices.md).
      CAT_OPENHAB_URL: ${CAT_OPENHAB_URL:-http://172.28.250.1:8080}
      # Datenträger-Widget: Partition des Datenordners (nicht das Overlay-Dateisystem des Containers).
      CAT_DISK_PATH: /data
      CAT_TLS_CERT: /data/certs/server.crt
      CAT_TLS_KEY: /data/certs/server.key
    volumes:
      - ./data:/data
    # Mit Sprache (STT base) braucht Cat ca. 600 MB. Ein Fehler in Cat darf Nextcloud nicht verdrängen.
    mem_limit: 1536m
    cpus: 3.0
    networks:
      default: {}
      # Netz von Caddy: so erreicht der Reverse-Proxy Cat unter cat-server:8000
      # (docs/public-access.md). Cat selbst ist nur über Caddy und das LAN-Port erreichbar.
      docker_proxy:
        aliases: [cat-server]

  # Code-Sandbox für das Tool run_python: KEIN Netzwerk, schreibgeschützt, ohne Capabilities,
  # mit Speicher-, CPU- und Prozesslimit. Cat und Sandbox tauschen nur Dateien in data/sandbox aus.
  sandbox:
    build: ./sandbox
    image: homelm-sandbox:latest
    container_name: homelm-sandbox
    restart: unless-stopped
    network_mode: none
    # PID 1 ist ein Init-Prozess, der verwaiste Kindprozesse einsammelt. Ohne ihn blieben sie als
    # Zombies stehen und füllten das Prozesslimit dauerhaft (Fork-Bomben-Test, 2026-10-17).
    init: true
    read_only: true
    user: "${CAT_UID:-10001}:${CAT_GID:-10001}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SANDBOX_DIR: /jobs
    volumes:
      - ./data/sandbox:/jobs

  # Lokales Modell (Priorität 1 in Cat). Startet NUR mit
  # "docker compose --profile offline up -d ollama" (oder zusammen mit der Brücke: siehe unten).
  # Braucht ca. 3 GB RAM, solange das Modell geladen ist (docs/offline.md, docs/claude.md).
  ollama:
    profiles: [offline]
    image: ollama/ollama:latest
    container_name: homelm-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 60m  # Modell nach 60 Minuten Leerlauf aus dem RAM entladen
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./data/ollama:/root/.ollama
    mem_limit: 3500m
    # Muss zu CAT_LOCAL_THREADS passen (Standard 5): mehr Threads als CPUs drosseln stark.
    # cpu_shares: Bei Last der anderen Dienste (Nextcloud, Trafficnetwork) haben diese Vorrang,
    # bei freien Kernen darf das Modell sie nutzen (gemessen: 3 Threads 3,9 Token/s, 5 Threads 4,6).
    cpus: 5.0
    cpu_shares: 256
    # Kein veröffentlichter Port: nur Cat im selben Compose-Netz spricht mit Ollama.

  # Claude über das Abo des Nutzers (docs/claude.md). Startet NUR mit
  # "docker compose --profile claude up -d claude-bridge". Das Token steht in claude.env
  # (nicht in .env, damit es nie im Cat-Container landet). Kein veröffentlichter Port.
  # Die CLI hat nur Lesezugriff auf das Gedächtnis, keine Befehle, keine Schreibrechte.
  claude-bridge:
    profiles: [claude]
    build: ./claude-bridge
    image: homelm-claude-bridge:latest
    container_name: homelm-claude-bridge
    restart: unless-stopped
    read_only: true
    init: true
    user: "${CAT_UID:-10001}:${CAT_GID:-10001}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=128m,mode=1777
    env_file:
      - path: claude.env
        required: false
    environment:
      HOME: /tmp/home
      MEMORY_DIR: /memory
    volumes:
      - ./data/memory:/memory:ro
      - ./data/inbox:/inbox:ro

networks:
  docker_proxy:
    external: true
    name: docker_proxy
  default:
    # Festes Subnetz, damit die Firewall-Regel für den Weg zu openHAB stabil bleibt.
    ipam:
      config:
        - subnet: 172.28.250.0/24
