[project]
name = "cat"
version = "0.1.0"
description = "Cat: eigener Home-Assistent (HomeLM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "litellm>=1.105.1",
    "psutil>=7.2.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=1.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Der Systemprompt ist Fließtext.
"src/cat/agent/prompt.py" = ["E501"]
# Testdaten (YAML-Zeilen) dürfen lang sein.
"tests/*" = ["E501"]
